[project]
name = "setu-raksha"
version = "0.1.0"
description = "National Bridge Infrastructure Safety & Intelligence Grid"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "services/simulator",
    "services/worker",
    "ml"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]
ignore = ["B008", "N818"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
addopts = "-v --tb=short"
