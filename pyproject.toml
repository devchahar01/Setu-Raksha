[project]
name = "setu-rakshak"
version = "0.1.0"
description = "Setu Rakshak: National Bridge Infrastructure Safety & Intelligence Grid"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "services/simulator",
    "services/worker",
    "ml"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]
ignore = ["B008", "N818", "E501", "ARG001", "E712", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_subclassing_any = false
warn_return_any = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api", "."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
