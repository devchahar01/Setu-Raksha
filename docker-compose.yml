version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: setu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-setu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-setu_raksha}
    ports:
      - "5432:5432"
    volumes:
      - setu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setu_user} -d ${POSTGRES_DB:-setu_raksha}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - setu_network

  redis:
    image: redis:7.2-alpine
    container_name: setu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - setu_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - setu_network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: setu-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminsecure}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - setu_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - setu_network

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: setu-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - setu_network

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: setu-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-setu_user}:${POSTGRES_PASSWORD:-setu_secure_password_123}@postgres:5432/${POSTGRES_DB:-setu_raksha}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - setu_network

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: setu-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-setu_user}:${POSTGRES_PASSWORD:-setu_secure_password_123}@postgres:5432/${POSTGRES_DB:-setu_raksha}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - setu_network

  beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: setu-beat
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=INFO"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - setu_network

  simulator:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.simulator
    container_name: setu-simulator
    restart: unless-stopped
    environment:
      API_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - setu_network

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: setu-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - setu_network

volumes:
  setu_pgdata:
    name: setu_pgdata
  setu_redisdata:
    name: setu_redisdata
  setu_miniodata:
    name: setu_miniodata

networks:
  setu_network:
    name: setu_network
    driver: bridge
